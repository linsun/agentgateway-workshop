# yaml-language-server: $schema=https://agentgateway.dev/schema/config
#
# CAPABILITY: route an OpenAI-compatible client to a self-hosted model.
#
# VERIFY THIS FILE FIRST. It is the smallest end-to-end check that your installed
# agentgateway accepts the simplified `llm:` config shape. Every other config
# here uses the same shape, so if this one binds on 4000, they all will.

llm:
  models:
  - name: trend-pro
    provider: openAI
    params:
      baseUrl: http://localhost:11434/v1
      model: qwen3:8b
      apiKey: ollama-does-not-check-this
  policies:
    cors:
      allowOrigins:
      - http://localhost:15000
      allowHeaders:
      - '*'
      allowMethods:
      - GET
      - POST

