# yaml-language-server: $schema=https://agentgateway.dev/schema/config
#
# CAPABILITY: turn a REST API into MCP tools with zero server code, and inject
# the upstream credential on egress so the agent never sees it.
#
# ---------------------------------------------------------------------------
# THE POINT
# ---------------------------------------------------------------------------
# There is no github_server.py in this repo. The gateway reads an OpenAPI spec,
# generates MCP tools from it, and attaches the credential going upstream. The
# agent gains a whole new source without a line of code and without ever
# holding a token.
#
# The get_rate_limit tool is in the spec for exactly one reason: it proves the
# injection happened. 60 requests/hour means unauthenticated. 5000 means the
# gateway attached your token.
#
# ---------------------------------------------------------------------------
# WHY A TRIMMED SPEC
# ---------------------------------------------------------------------------
# The full GitHub OpenAPI description is enormous and would generate hundreds
# of tools, which would ironically re-teach the tool-sprawl lesson from step 2.
# github-search.openapi.json has three operations. It also ships in this repo,
# so nothing has to be fetched at startup.
#
# ---------------------------------------------------------------------------
# TOKEN
# ---------------------------------------------------------------------------
# export GITHUB_TOKEN=<fine-grained PAT, public repo read is enough>
#
# If someone has no token, this still works at GitHub's unauthenticated rate
# limit of 60 requests/hour, which is plenty for a lab. They just see 60 rather
# than 5000 from get_rate_limit, which makes the point equally well from the
# other direction.
#
# VERIFY: whether your build wants schema.file, schema.url or an inline schema.
# Swap to the url form if file is not supported:
#   schema:
#     url: https://raw.githubusercontent.com/github/rest-api-description/main/descriptions/api.github.com/api.github.com.json

# ---------------------------------------------------------------------------
# DEBUGGING: 401 FROM GET_RATE_LIMIT
# ---------------------------------------------------------------------------
# A 401 (not the 60/hour result) means the gateway attached a credential and
# GitHub rejected it. An unset token gives the 60/hour unauthenticated result
# instead, so a 401 points at the token value itself, not a missing one.
#
# Isolate token vs gateway by testing the raw token OUTSIDE agentgateway, in
# the SAME shell you launched the gateway from:
#
#   echo "[$GITHUB_TOKEN]"
#   curl -sS -o /dev/null -w "%{http_code}\n" \
#     -H "Authorization: Bearer $GITHUB_TOKEN" \
#     https://api.github.com/rate_limit
#
#   200 -> token is valid; the problem is the gateway. Most often the process
#          was already running when you exported the var -- env vars are read
#          once at startup. Kill agentgateway and restart it in that shell.
#   401 -> GitHub rejects the token itself: expired, revoked, or wrong type.
#          /rate_limit needs no scopes, so any valid token returns 5000 here.
#          Fine-grained PATs default to a short expiry -- check it is active.
#
# The echo line is a sanity check: [] means the var is empty in this shell;
# ["ghp_..."] with quotes hugging the token means you exported it WITH quotes,
# so the literal quote characters are being sent.

# ONE GATEWAY, TWO LANES (see 03): this config serves the LLM lane on 4000 and
# the GitHub MCP lane on 3000. The agent needs both; one process avoids the
# admin-port (15000) collision two agentgateway processes would hit.
#   LLM_BASE_URL=http://localhost:4000/v1  LLM_MODEL=trend-pro
#   MCP_URL=http://localhost:3000/mcp
llm:
  port: 4000
  models:
    - name: trend-pro
      provider: openAI
      params:
        baseUrl: http://localhost:11434/v1
        model: qwen3:8b
        apiKey: ollama-does-not-check-this
mcp:
  port: 3000
  policies:
    cors:
      # MCP 2026-07-28 is stateless: the Mcp-Session-Id header and the
      # protocol-level session are gone, so there is nothing to expose.
      # Routing metadata now rides in headers instead of the JSON-RPC
      # body, which is what lets a load balancer route without parsing.
      allowOrigins: ["*"]
      allowHeaders:
        - content-type
        - accept
        - cache-control
        - mcp-protocol-version
        - mcp-method
        - mcp-name
    backendAuth:
      key:
        value: $GITHUB_TOKEN
  targets:
    - name: github
      openapi:
        # host takes a URI with scheme -- use https:// so the gateway does TLS.
        # A bare host:port (api.github.com:443) connects in plaintext to a TLS
        # port and the connection is dropped ("connection closed").
        host: https://api.github.com
        schema:
          file: ./configs/github-search.openapi.json
