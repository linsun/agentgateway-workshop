# yaml-language-server: $schema=https://agentgateway.dev/schema/config
config:
  database:
    url: sqlite://./data.db
llm:
  port: 4000
  models:
  - name: trend-pro
    provider: openAI
    params:
      baseUrl: http://localhost:11434/v1
      model: qwen3:8b
      apiKey: ollama-does-not-check-this
mcp:
  port: 3000
  policies:
    cors:
      allowOrigins:
      - '*'
      - http://localhost:15000
      allowHeaders:
      - content-type
      - accept
      - cache-control
      - mcp-protocol-version
      - mcp-method
      - mcp-name
      - '*'
      allowMethods:
      - GET
      - POST
      exposeHeaders:
      - Mcp-Session-Id
    backendAuth:
      key:
        value: $GITHUB_TOKEN
  targets:
  - name: github
    openapi:
      host: https://api.github.com
      schema:
        file: ./configs/github-search.openapi.json
