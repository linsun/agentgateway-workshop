# yaml-language-server: $schema=https://agentgateway.dev/schema/config
config:
  database:
    url: sqlite://./data.db
llm:
  port: 4000
  models:
  - name: trend-pro
    provider: openAI
    params:
      baseUrl: http://localhost:11434/v1
      model: qwen3:8b
      apiKey: ollama-does-not-check-this
mcp:
  port: 3000
  policies:
    cors:
      allowOrigins:
      - '*'
      - http://localhost:15000
      allowHeaders:
      - content-type
      - accept
      - cache-control
      - mcp-protocol-version
      - mcp-method
      - mcp-name
      - '*'
      allowMethods:
      - GET
      - POST
      exposeHeaders:
      - Mcp-Session-Id
    mcpAuthentication:
      mode: strict
      issuer: http://localhost:9000
      audiences:
      - http://localhost:3000/mcp
      jwks:
        url: http://localhost:9000/.well-known/jwks.json
      resourceMetadata:
        resource: http://localhost:3000/mcp
        scopesSupported:
        - read:all
        bearerMethodsSupported:
        - header
    mcpAuthorization:
      rules:
      - mcp.tool.target == "trends"
      - mcp.tool.target == "publish" && mcp.tool.name == "get_public_feed"
      - mcp.tool.target == "workspace" && has(jwt.sub)
      - mcp.tool.target == "publish" && has(jwt.roles) && "publisher" in jwt.roles
  targets:
  - name: trends
    stdio:
      cmd: .venv/bin/python3
      args:
      - ./mcp-servers/trends_server.py
  - name: workspace
    stdio:
      cmd: .venv/bin/python3
      args:
      - ./mcp-servers/workspace_server.py
  - name: publish
    stdio:
      cmd: .venv/bin/python3
      args:
      - ./mcp-servers/publish_server.py
