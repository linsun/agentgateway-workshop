# yaml-language-server: $schema=https://agentgateway.dev/schema/config
config:
  database:
    url: sqlite://./data.db
frontendPolicies:
  tracing:
    host: localhost:4317
    randomSampling: true
llm:
  port: 4000
  models:
  - name: trend-pro
    provider: openAI
    params:
      baseUrl: http://localhost:11434/v1
      model: qwen3:8b
      apiKey: ollama-does-not-check-this
  policies:
    cors:
      allowOrigins:
      - http://localhost:15000
      allowHeaders:
      - '*'
      allowMethods:
      - GET
      - POST
mcp:
  port: 3000
  # MCP 2026-07-28 is stateless: no initialize handshake, no Mcp-Session-Id. Run
  # the listener stateless so it accepts tools/list and tools/call directly and
  # never allocates a session -- the agent then speaks the modern, session-less
  # flow and the gateway log shows no initialize / notifications/initialized.
  statefulMode: stateless
  policies:
    cors:
      allowOrigins:
      - '*'
      - http://localhost:15000
      allowHeaders:
      - content-type
      - accept
      - cache-control
      - mcp-protocol-version
      - mcp-method
      - mcp-name
      - '*'
      allowMethods:
      - GET
      - POST
  targets:
  - name: trends
    stdio:
      cmd: .venv/bin/python3
      args:
      - ./mcp-servers/trends_server.py
